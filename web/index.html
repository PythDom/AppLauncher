<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Launcher</title>
<style>
:root {
    --bg: #e9e9ec; --bar: #d6d6da; --card: #f5f5f7; --text: #111; --muted: #6b6b72;
    --accent: #1a73e8; --danger: #d93025; --line: rgba(0,0,0,.12); --tile: #fff;
}
@media (prefers-color-scheme: dark) {
    :root { --bg: #101012; --bar: #1c1c1f; --card: #1f1f23; --text: #eee; --muted: #9a9aa2;
            --accent: #8ab4f8; --danger: #f28b82; --line: rgba(255,255,255,.14); --tile: #2a2a2f; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Roboto, Arial, sans-serif; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }

header { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--bar); }
#q { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border-radius: 22px; border: 1px solid var(--line);
     background: var(--tile); color: var(--text); outline: none; }
header button { width: 40px; height: 40px; font-size: 20px; border-radius: 50%; border: 1px solid var(--line);
     background: var(--tile); color: var(--text); flex-shrink: 0; padding: 0; }

#pager { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
         scrollbar-width: none; overscroll-behavior-x: contain; }
#pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto;
        padding: 6px 10px 90px; }

#dots { display: flex; justify-content: center; gap: 10px; padding: 6px 0 8px; background: var(--bg); }
#dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: var(--line); }
#dots button.on { background: var(--accent); width: 22px; border-radius: 6px; }

.group { margin: 10px 0; padding: 2px 8px 8px; background: var(--card); border: 1px solid var(--line);
         border-radius: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.10); }
.ghead { display: flex; align-items: center; gap: 8px; padding: 10px 6px 6px; user-select: none; -webkit-user-select: none; }

/* screen 2: plain names, most used first */
.plainnote { font-size: 13px; color: var(--muted); padding: 8px 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plainnote button { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--tile); color: var(--text); font-size: 13px; }
.plain { padding: 2px 4px; }
.pl { padding: 13px 12px; font-size: 20px; font-family: Arial, Helvetica, sans-serif; letter-spacing: .2px;
      border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.pl:active { background: var(--line); }
.pl.sel { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.cardbar { display: flex; gap: 8px; justify-content: flex-end; padding: 4px 2px 0; }
.cardbar button, .cloudbar button { padding: 7px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--tile); color: var(--text); font-size: 13px; }
.cloudbar { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 6px 4px 0; font-size: 13px; color: var(--muted); }

/* screen 0: keyword cloud */
.cloudnote { font-size: 13px; color: var(--muted); text-align: center; padding: 10px 14px 0; }
.cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 6px; padding: 14px 4px 24px; }
.kw { border: 0; background: transparent; padding: 3px 7px; border-radius: 12px; font-family: Arial, Helvetica, sans-serif;
      font-weight: 700; line-height: 1.15; cursor: pointer; }
.kw:active { background: var(--line); }
.pinrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 4px 2px; }
.pinrow .lab { font-size: 12px; color: var(--muted); margin-right: 4px; }
.kw.pin { border: 1.5px solid currentColor; border-radius: 18px; padding: 4px 11px; }
.cloudhead { display: flex; align-items: center; gap: 10px; padding: 6px 4px 4px; }
.cloudhead button { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--tile); color: var(--text); font-size: 15px; }
.cloudhead .t { font-size: 20px; font-weight: 700; flex: 1; }
.ask { margin: 10px 4px; padding: 12px; width: calc(100% - 8px); border-radius: 14px; border: 1px dashed var(--accent);
       background: transparent; color: var(--accent); font-size: 15px; }
.sect { font-size: 13px; color: var(--muted); padding: 10px 8px 2px; }
.ghead .name { font-size: 16px; font-weight: 700; flex: 1; }
.ghead .cnt { font-size: 12px; color: var(--muted); }
.ghead .chev { font-size: 12px; color: var(--muted); width: 14px; }
.ghead.unsorted .name { color: var(--muted); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px 6px; padding: 2px 2px 6px; }
.grid.collapsed { display: none; }
.empty { color: var(--muted); font-size: 13px; padding: 4px 8px 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 2px; border-radius: 12px;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tile img { width: 54px; height: 54px; border-radius: 13px; object-fit: contain; background: var(--tile); pointer-events: none; }
.tile .lbl { font-size: 11px; line-height: 1.15; text-align: center; max-width: 100%; display: -webkit-box;
             -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.tile:active { background: var(--line); }
.tile.sel { background: color-mix(in srgb, var(--accent) 28%, transparent); outline: 2px solid var(--accent); }

/* dashboard: time / agenda / weather */
.wcard { margin: 8px 0; padding: 6px 10px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 22px;
         box-shadow: 0 1px 3px rgba(0,0,0,.10); }
.wh { display: flex; align-items: center; gap: 8px; padding: 6px 2px 4px; }
.wh .wt { flex: 1; font-size: 15px; font-weight: 700; }
.wh button { width: 34px; height: 34px; padding: 0; font-size: 18px; border-radius: 50%; border: 1px solid var(--line);
             background: var(--tile); color: var(--text); }
.zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.zone { padding: 6px 7px; border-radius: 14px; background: var(--tile); border: 1px solid var(--line); min-width: 0; }
.zone.here { border-color: var(--accent); }
.zc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zt { font-size: 21px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.zd { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.dslot { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; padding: 4px 0; border-radius: 12px;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.dslot:active { background: var(--line); }
.dslot img { width: 100%; max-width: 46px; aspect-ratio: 1; border-radius: 11px; object-fit: contain; background: var(--tile); pointer-events: none; }
.dslot div { font-size: 9px; line-height: 1.1; max-width: 100%; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dslot.empty { align-self: center; aspect-ratio: 1; max-width: 46px; width: 100%; margin: 4px auto; justify-content: center; font-size: 22px;
               color: var(--muted); border: 1.5px dashed var(--line); }
.dockopt { display: flex; align-items: center; gap: 12px; }
.dockopt img { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; background: var(--tile); }
.agd { font-size: 12px; font-weight: 700; color: var(--accent); padding: 8px 2px 3px; text-transform: uppercase; letter-spacing: .4px; }
.age { display: flex; gap: 10px; padding: 7px 8px; margin: 3px 0; border-left: 4px solid var(--accent); border-radius: 8px;
       background: var(--tile); user-select: none; -webkit-user-select: none; }
.age:active { background: var(--line); }
.age.now { outline: 1.5px solid var(--accent); }
.age.past { opacity: .5; }
.aget { flex: 0 0 76px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.agx { flex: 1; min-width: 0; }
.agtt { font-size: 15px; line-height: 1.25; word-break: break-word; }
.agl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wnote { font-size: 11px; color: var(--muted); padding: 8px 2px 0; white-space: pre-wrap; }
.wxcur { display: flex; align-items: center; gap: 14px; padding: 2px 2px 6px; flex-wrap: wrap; }
.wxbig { font-size: 34px; font-weight: 700; white-space: nowrap; }
.wxdet { font-size: 13px; color: var(--muted); white-space: pre-line; line-height: 1.5; }
.wxhours { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.wxh { flex: 0 0 auto; width: 48px; text-align: center; font-size: 12px; padding: 5px 0; border-radius: 12px; background: var(--tile); }
.wxh div:nth-child(2) { font-size: 18px; }
.wxp { color: var(--accent); font-size: 11px; min-height: 14px; }
.wxd { display: flex; gap: 8px; align-items: center; padding: 5px 4px; border-top: 1px solid var(--line); font-size: 14px; }
.wxc0 { flex: 0 0 62px; } .wxc1 { flex: 0 0 28px; font-size: 18px; } .wxc2 { flex: 1; font-size: 12px; color: var(--accent); }
.wxc3 { flex: 0 0 auto; font-variant-numeric: tabular-nums; }

#results { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; background: var(--bg); overflow-y: auto;
           padding: 8px 10px 90px; z-index: 5; }
#results[hidden] { display: none; }

#selbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; gap: 6px; align-items: center;
          padding: 10px; background: var(--bar); border-top: 1px solid var(--line); }
#selbar[hidden] { display: none; }
#selbar .n { flex: 1; font-size: 14px; }
#selbar button { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--tile);
                 color: var(--text); font-size: 14px; }
#selbar button.p { background: var(--accent); color: #fff; border: 0; }

#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: none; align-items: flex-end;
           justify-content: center; }
#overlay.open { display: flex; }
.card { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--card);
        border-radius: 18px 18px 0 0; padding: 14px 14px 18px; }
.card h3 { margin: 2px 4px 10px; font-size: 17px; white-space: pre-line; }
.card label { display: block; font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.card label.chk { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; }
.card input[type=text], .card input[type=url], .card input[type=password], .card select, .card textarea {
    width: 100%; margin-top: 4px; padding: 10px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--tile); color: var(--text); }
.card input[type=checkbox] { width: 20px; height: 20px; }
.sbtn { display: block; width: 100%; text-align: left; padding: 13px 12px; margin: 0; font-size: 16px; border: 0;
        border-bottom: 1px solid var(--line); background: transparent; color: var(--text); }
.sbtn.danger { color: var(--danger); }
.sbtn small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.row button { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--tile);
              color: var(--text); font-size: 15px; }
.row button.p { background: var(--accent); color: #fff; border: 0; }
.note { font-size: 13px; color: var(--muted); margin: 8px 2px 0; white-space: pre-wrap; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 90%; z-index: 30;
         background: #2b2b30; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0;
         pointer-events: none; transition: opacity .25s; text-align: center; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <input id="q" type="search" placeholder="Search or describe…" autocomplete="off" autocapitalize="off">
    <button id="btnAdd" title="Add">＋</button>
    <button id="btnMenu" title="Menu">⋮</button>
  </header>
  <div id="pager">
    <section class="page" id="pageCloud"></section>
    <section class="page" id="pageDash"></section>
    <section class="page" id="page0"></section>
    <section class="page" id="page1"></section>
  </div>
  <div id="dots"><button data-p="0" aria-label="Keyword cloud"></button><button class="on" data-p="1" aria-label="Dashboard"></button><button data-p="2" aria-label="Categories"></button><button data-p="3" aria-label="Most used list"></button></div>
  <div id="results" hidden></div>
  <div id="selbar" hidden>
    <span class="n" id="seln"></span>
    <button id="selMove" class="p">Move to…</button>
    <button id="selMore">Hide</button>
    <button id="selDone">Done</button>
  </div>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<script src="mock.js"></script>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
