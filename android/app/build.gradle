plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pythdom.applauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'org.pythdom.applauncher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The web UI lives in /web and is bundled into the APK as assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    signingConfigs {
        release {
            storeFile file('../launcher.keystore')
            storePassword 'launcher'
            keyAlias 'launcher'
            keyPassword 'launcher'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
